# USD per million tokens: input, 5-minute cache write, 1-hour cache write, cache read, output.
# https://platform.claude.com/docs/en/about-claude/pricing
read = 2026-10-13
us_only = 1.1          # every price, for inference_geo "us"

[models]
claude-fable-5-1 = [10.0, 12.5, 20.0, 0.25, 50.0]
claude-opus-5-5 = [4.0, 5.0, 8.0, 0.20, 20.0]
claude-sonnet-5-5 = [2.0, 2.5, 4.0, 0.20, 10.0]
claude-haiku-5-5 = [0.10, 0.125, 0.20, 0.01, 0.50]

# The [long_prompt] table must stay in this file (load_prices refuses a file without it), even when it is empty.
# Haiku 5.5 prices a whole request higher when its prompt (input, cache reads and cache
# writes together) is over this many tokens.
[long_prompt.claude-haiku-5-5]
over = 100_000
prices = [0.50, 0.625, 1.0, 0.05, 2.50]
