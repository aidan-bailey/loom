<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Superpowers Brainstorming</title>
<style>
  body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: #1d1d1f; color: #f5f5f7; }
  .header { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 12px; color: #86868b; border-bottom: 1px solid #333; }
  .main { padding: 20px 16px 72px; }
  h2 { margin: 0 0 6px; font-size: 20px; }
  .subtitle { margin: 0 0 18px; color: #a1a1a6; font-size: 14px; }
  .option { display: flex; gap: 12px; padding: 14px; margin-bottom: 12px; border: 1px solid #3a3a3c; border-radius: 12px; background: #2c2c2e; }
  .option.selected { border-color: #0a84ff; }
  .letter { flex: none; width: 28px; height: 28px; border-radius: 50%; background: #3a3a3c; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .option h3 { margin: 0 0 4px; font-size: 16px; }
  .option p { margin: 0; color: #a1a1a6; font-size: 13px; }
  .wire { height: 64px; margin-top: 10px; border: 1px dashed #555; border-radius: 6px; background: #242426; }
  .indicator { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; font-size: 13px; color: #86868b; background: #2c2c2e; border-top: 1px solid #3a3a3c; }
</style>
</head>
<body>
  <div class="header"><span>Superpowers Brainstorming</span><span>Connected</span></div>
  <div class="main">
    <h2>Which layout works better?</h2>
    <p class="subtitle">Consider readability on a small screen</p>
    <div class="options">
      <div class="option selected" data-choice="a" onclick="toggleSelect(this)">
        <div class="letter">A</div>
        <div><h3>Single column</h3><p>Clean, focused reading</p><div class="wire"></div></div>
      </div>
      <div class="option" data-choice="b" onclick="toggleSelect(this)">
        <div class="letter">B</div>
        <div><h3>Two column</h3><p>Sidebar with the content</p><div class="wire"></div></div>
      </div>
    </div>
  </div>
  <div class="indicator" id="indicator-text">Single column selected — return to terminal to continue</div>
  <script>
    window.brainstorm = { send: function () {} };
    window.toggleSelect = function (el) {
      el.parentNode.querySelectorAll(".option").forEach(function (o) { o.classList.remove("selected"); });
      el.classList.add("selected");
    };
  </script>
</body>
</html>
